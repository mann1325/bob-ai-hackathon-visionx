submission:
  title: "SignalTrace"                 # REQUIRED

  problem_statement: >                 # REQUIRED
    Pharmacovigilance teams can identify candidate drug safety signals from
    FDA FAERS adverse-event data, but investigating the evidence behind those
    signals and connecting them to potentially impacted regulatory documents
    still requires fragmented, manual workflows across separate systems,
    spreadsheets, and reports.

  solution_summary: >                  # REQUIRED
    SignalTrace is an AI-assisted pharmacovigilance decision-support platform
    that uses official FDA FAERS quarterly data and a Machine-Geist
    signal-detection foundation to detect candidate drug-event safety
    signals, then connects them to a structured evidence investigation
    workspace, Groq-generated explanations, deterministic regulatory-document
    mapping, and Gemini-based document analysis — keeping qualified human
    review at the center of every decision.

  key_features:                        # REQUIRED
    - "Deterministic signal detection (PRR/ROR/trend) on official FDA FAERS quarterly data, built on a Machine-Geist foundation"
    - "Case quality analysis and potential duplicate triage (version-level and cross-case) with no automatic deletion"
    - "Groq-powered evidence explanation grounded in backend-computed statistical facts"
    - "Deterministic signal-to-regulatory-document mapping (Product Label, RSI, PSUR/PBRER, RMP, CTD content)"
    - "Gemini-based document intelligence to flag relevant sections, inconsistencies, and coverage gaps in uploaded regulatory documents"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Next.js", "React"]
    ibm_technologies: ["IBM Bob"]
    databases: ["PostgreSQL", "Supabase"]
    other: ["Groq API", "Gemini API", "FDA FAERS Quarterly Data", "openFDA API"]

  what_we_are_most_proud_of: >         # TODO: confirm this still matches what you actually shipped
    The Signal-to-Regulatory Impact Bridge — the deterministic engine that
    connects a detected safety signal directly to the specific regulatory
    documents (label, RSI, PSUR/PBRER, RMP, CTD sections) that may need
    review, closing the gap between pharmacovigilance and regulatory teams
    that today is handled manually.

  known_limitations: >                 # TODO: replace with your team's actual, honest gaps at deadline
    AI components (Groq, Gemini) are used strictly for explanation and
    document analysis, not for computing core statistical metrics or making
    final regulatory/safety decisions — all outputs require human review.
    [Add any incomplete features, mocked data, or time-constrained shortcuts here.]

