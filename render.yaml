services:
  - type: web
    name: signaltrace-backend
    runtime: python
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENFDA_API_BASE_URL
        value: https://api.fda.gov
      - key: OPENFDA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
